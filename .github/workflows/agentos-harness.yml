name: AgentOS Harness
on:
  push:
    branches: [harness]
    paths:
      - 'agentos/**'
      - '.github/workflows/agentos-harness.yml'
  pull_request:
    paths:
      - 'agentos/**'
      - '.github/workflows/agentos-harness.yml'
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agentos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate client JavaScript syntax
        run: node --check agentos/ui/app.js && node --check agentos/layerfs_bridge.mjs
      - name: Plan and environment preflight (non-executing)
        run: |
          python -m agentos.plan_lint examples/demo.json --format json
          python -m agentos.plan_lint examples/agent-declarations.json
          python -m agentos.doctor --backend host --ui web --format json
      - name: Unit, documentation and integration tests
        run: python -m unittest discover -s tests -v
      - name: End-to-end multi-Agent scenario
        run: python -m agentos.cli examples/demo.json --report /tmp/agentos-report.json --trace /tmp/agentos-trace.jsonl
      - name: Agent-declared DAG end-to-end
        run: python -m agentos.cli examples/agent-declarations.json --report /tmp/agentos-declared.json
      - name: Synthetic microbenchmark smoke test
        run: python -m bench.benchmark --tasks 6 --parallel 3 --sleep 0.05 --trials 2

  openeuler:
    runs-on: ubuntu-latest
    container:
      image: openeuler/openeuler:24.03-lts-sp4
    steps:
      - uses: actions/checkout@v4
      - name: Install Python on openEuler
        run: dnf install -y python3
      - name: Install Node.js for mocked bridge testing
        run: dnf install -y nodejs npm
      - name: Validate UI client and LayerFS bridge JavaScript
        run: cd agentos && node --check agentos/ui/app.js && node --check agentos/layerfs_bridge.mjs
      - name: openEuler static plan and documentation entry points
        run: |
          cd agentos
          python3 -m agentos.plan_lint examples/demo.json --format json
          python3 -m agentos.doctor --backend host --ui web --format json
      - name: openEuler kernel-independent supervisor and docs tests
        run: cd agentos && python3 -m unittest discover -s tests -v
      - name: openEuler end-to-end multi-Agent scenario
        run: cd agentos && python3 -m agentos.cli examples/demo.json
      - name: openEuler Agent-declared DAG end-to-end
        run: cd agentos && python3 -m agentos.cli examples/agent-declarations.json
